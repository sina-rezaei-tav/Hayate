[package]
name = "Hayate"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
ratatui-image = "3.0"
jwalk = "0.8"
notify = "6.1"
thiserror = "2.0"
anyhow = "1.0"
compact_str = "0.8"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true